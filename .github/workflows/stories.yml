# GitHub Actions: the stories job. When Jira calls it (a Jira Automation rule sends a repository_dispatch of type stories-ready), when started by hand
# (its schedule is off: the schedule block below): the stories in Jira's ready status become tests or come back pushed back, the
# cards are moved, and what changed is proposed as a pull request. Nothing to do: it stops in a minute.
# Secrets: JIRA_API_TOKEN, JIRA_EMAIL, ANTHROPIC_API_KEY (JIRA_EMAIL on Jira Cloud only). Not set up yet
# (jira-loop/jira.properties blank): it does nothing.
# Three jobs, each on a machine of its own (TODO 50): claim takes the ready stories in Jira (its token and a
# git token, never stored); crew works on them with the Anthropic key alone, its read-only checkout holding no
# credential; publish, from a fresh checkout of main, pushes each branch the crew bundled and opens its pull
# request. A story's text comes from Jira: the crew is never on a machine that holds anything more. A merge to
# main reports the story done and frees what it held. More agents: the team block below.
# The pull requests need Settings > Actions > General > "Allow GitHub Actions to create and approve pull requests".
name: Stories from Jira
on:
  repository_dispatch:
    types: [stories-ready]
  workflow_dispatch:
  push:
    branches: [main]
  # ==== YOURS (schedule): safe to edit; regenerating keeps what is between these lines ====
  # Off: no poll for stories (Jira calls it, or start it by hand). To run it, take the "# " off the lines below (the time is UTC).
  # schedule:
  #   - cron: '7 * * * 1-5'
  # ==== END YOURS (schedule) ====
concurrency:
  group: stories-${{ github.event_name }}
# The least power that works: the repository read; claim, publish and merged alone may write (branches, locks
# and pull requests), and each step is given only the secrets it uses.
permissions:
  contents: read
env:
# ==== YOURS (team): safe to edit; regenerating keeps what is between these lines ====
  SUITE_AGENTS: 3
  SUITE_STORIES: 3
# ==== END YOURS (team) ====
jobs:
  claim:
    if: ${{ github.event_name != 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      any: ${{ steps.claim.outputs.any }}
      agents: ${{ steps.claim.outputs.agents }}
      claimed: ${{ steps.claim.outputs.claimed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
      - id: claim
        run: node jira-loop/agents.mjs claim
        env:
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          SUITE_GIT_TOKEN: ${{ github.token }}
  crew:
    needs: claim
    if: ${{ needs.claim.outputs.any == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        agent: ${{ fromJSON(needs.claim.outputs.agents) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'
      - run: bash jira-loop/stories.sh
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUITE_AGENT: ${{ matrix.agent }}
          SUITE_CLAIMED: ${{ needs.claim.outputs.claimed }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: bundle-${{ matrix.agent }}
          path: jira-loop/run/*.bundle
          if-no-files-found: ignore
          retention-days: 1
  publish:
    needs: [claim, crew]
    if: ${{ always() && needs.claim.outputs.any == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
      - run: gh run download "$RUN" --repo "$REPO" --pattern "bundle-*" --dir jira-loop/run || echo "No bundle from the crew."
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.run_id }}
          REPO: ${{ github.repository }}
      - run: node jira-loop/agents.mjs publish jira-loop/run/*/*.bundle
        env:
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          SUITE_GIT_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          SUITE_CLAIMED: ${{ needs.claim.outputs.claimed }}
          SUITE_PROPOSE: 'gh pr create --head "{branch}" --title "{key}: {title}" --body "Tests for {key}, written by the suite''s crew. Merging it moves the card to done."'
          SUITE_AGAIN: gh api "repos/${{ github.repository }}/dispatches" -f event_type=stories-ready
  merged:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
      - run: node jira-loop/agents.mjs merged
        env:
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          SUITE_GIT_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          SUITE_AGAIN: gh api "repos/${{ github.repository }}/dispatches" -f event_type=stories-ready
