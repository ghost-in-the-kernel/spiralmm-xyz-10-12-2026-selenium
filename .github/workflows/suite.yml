# Generated by Suite Builder for https://spiralmm.com. EDIT RULES: edit only inside YOURS blocks; regenerating keeps them and rewrites the rest of this file.
# GitHub Actions: on every push and pull request, the quick check (http and smoke, in chromium): a site
# that is down or a page type that no longer opens fails in a minute or two. When started by hand (no nightly
# run: its schedule is off), every test, once in each of chromium and firefox. The results and any failure's
# evidence are kept with each run. Another copy of the site (a staging server): set BASE_URL.
name: Suite
on:
  push:
  pull_request:
  workflow_dispatch:
  # ==== YOURS (schedule): safe to edit; regenerating keeps what is between these lines ====
  # Off: no nightly run. To run it, take the "# " off the lines below (the time is UTC).
  # schedule:
  #   - cron: '23 3 * * *'
  # ==== END YOURS (schedule) ====
# The least power that works: the repository read, nothing more.
permissions:
  contents: read
env:
  # ==== YOURS (env): safe to edit; regenerating keeps what is between these lines ====
  # Another copy of the site: a repository variable BASE_URL (Settings > Variables); unset, the crawled site.
  BASE_URL: ${{ vars.BASE_URL }}
  # ==== END YOURS (env) ====
jobs:
  quick:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: mvn -B test -Dgroups=http,smoke -Dbrowser=chromium
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: quick
          if-no-files-found: ignore
          path: |
            target/surefire-reports/TEST-*.xml
            target/report.html
            target/failures/
  full:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: mvn -B test -Dbrowser=${{ matrix.browser }}
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: full-${{ matrix.browser }}
          if-no-files-found: ignore
          path: |
            target/surefire-reports/TEST-*.xml
            target/report.html
            target/failures/
  # ==== YOURS (jobs): safe to edit; regenerating keeps what is between these lines ====
  # ==== END YOURS (jobs) ====
