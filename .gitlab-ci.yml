# GitLab CI: on every push and pull request, the quick check (http and smoke, in chromium): a site
# that is down or a page type that no longer opens fails in a minute or two. When started by hand (no nightly
# run: its schedule is off), every test, once in each of chromium and firefox. The results and any failure's
# evidence are kept with each run. Another copy of the site (a staging server): set BASE_URL.
# No nightly run; for one, a pipeline schedule (Build > Pipeline schedules), at 23 3 * * * UTC say. BASE_URL: a CI/CD variable.
# Java, Maven and every system library a browser needs (Playwright's image); Selenium Manager fetches Chrome or Firefox, and its driver, at the run's start.
default:
  image:
    name: mcr.microsoft.com/playwright/java:v1.56.0-noble
    entrypoint: ['']
quick:
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - mvn -B test -Dgroups=http,smoke -Dbrowser=chromium "-DbrowserArgs=--no-sandbox --disable-dev-shm-usage"
  artifacts:
    name: quick
    when: always
    expire_in: 2 weeks
    paths:
      - target/report.html
      - target/failures/
    reports:
      junit: target/surefire-reports/TEST-*.xml
full:
  rules:
    - if: $SUITE_JOB == "stories"
      when: never
    - if: $CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "web"
  parallel:
    matrix:
      - BROWSER: chromium
        BROWSER_ARGS: "--no-sandbox --disable-dev-shm-usage"
      - BROWSER: firefox
  script:
    - mvn -B test -Dbrowser=$BROWSER "-DbrowserArgs=$BROWSER_ARGS"
  artifacts:
    name: full-$BROWSER
    when: always
    expire_in: 2 weeks
    paths:
      - target/report.html
      - target/failures/
    reports:
      junit: target/surefire-reports/TEST-*.xml
# The stories jobs: a pipeline trigger (Jira Automation) or a schedule with SUITE_JOB=stories. Three jobs (TODO 50):
# claim and publish hold the Jira token and SUITE_PUSH_TOKEN (a project access token that may push); the crew's
# job holds ANTHROPIC_API_KEY alone. CI/CD variables reach every job unless scoped: scope JIRA_API_TOKEN, JIRA_EMAIL
# and SUITE_PUSH_TOKEN to the environment "jira" (Settings > CI/CD > Variables > Environment scope), mask them, and
# leave ANTHROPIC_API_KEY unscoped. The crew's job stops, changing nothing, when it is given one of the others.
stories-claim:
  rules:
    - if: $SUITE_JOB == "stories"
  image: node:20
  environment:
    name: jira
    action: access
  variables:
    SUITE_GIT_TOKEN: $SUITE_PUSH_TOKEN
    SUITE_GIT_USER: oauth2
  script:
    - git remote set-url origin "https://$CI_SERVER_HOST/$CI_PROJECT_PATH.git"
    - node jira-loop/agents.mjs claim
  artifacts:
    paths: [jira-loop/run/claimed.json]
    expire_in: 1 day
stories-crew:
  rules:
    - if: $SUITE_JOB == "stories"
  needs: [stories-claim]
  image: node:20
  variables:
    SUITE_AGENT: agent-1
  script:
    - apt-get update -qq
    - apt-get install -y -qq openjdk-17-jdk-headless maven > /dev/null
    - bash jira-loop/stories.sh
  artifacts:
    when: always
    paths: [jira-loop/run/]
    expire_in: 1 day
stories-publish:
  rules:
    - if: $SUITE_JOB == "stories"
      when: always
  needs: [stories-claim, stories-crew]
  image: node:20
  environment:
    name: jira
    action: access
  variables:
    SUITE_GIT_TOKEN: $SUITE_PUSH_TOKEN
    SUITE_GIT_USER: oauth2
    SUITE_PUSH_OPTIONS: "merge_request.create\nmerge_request.target=$CI_DEFAULT_BRANCH\nmerge_request.title={key}: {title}"
  script:
    - git remote set-url origin "https://$CI_SERVER_HOST/$CI_PROJECT_PATH.git"
    - node jira-loop/agents.mjs publish jira-loop/run/*.bundle
